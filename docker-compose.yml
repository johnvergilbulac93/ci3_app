services:
  app:
    environment:
      - CI_ENV=production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci3_app
    image: johnvergilbulac/ci3_app:latest
    restart: unless-stopped
    networks:
      - ci3_network
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webserver:
    # image: nginx:alpine
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: ci3_webserver
    restart: unless-stopped
    ports:
      - "9080:9080"
    # volumes:
    #   # - ./:/var/www/html
    #   - ./docker/default.conf:/etc/nginx/conf.d/default.conf
    #   - app_code:/var/www/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9080"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ci3_network
    depends_on:
      - app
networks:
  ci3_network:
    driver: bridge

